# M7Arena — nginx LOCAL (sem SSL, espelho da produção)
# Serve o build do Vite e faz proxy de /api/* para o container app:3000.
# Escuta na porta 80 do container, publicada como 3000 no host.

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 10M;

    # Security Headers (iguais à produção, sem HSTS por ser HTTP local)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    upstream node_api {
        server app:3000;
    }

    upstream realtime {
        server realtime:3001;
    }

    # Crawlers de redes sociais (WhatsApp, Facebook, Discord, Telegram, Twitter,
    # LinkedIn, Pinterest, Google...) — não executam JS. Para salas, eles recebem
    # a página OG dinâmica da API em vez do SPA, para o card do link mostrar a
    # imagem do modo. Humanos (browsers) continuam no SPA normal.
    map $http_user_agent $is_crawler {
        default 0;
        ~*whatsapp 1;
        ~*facebookexternalhit 1;
        ~*facebot 1;
        ~*twitterbot 1;
        ~*linkedinbot 1;
        ~*slackbot 1;
        ~*pinterestbot 1;
        ~*telegrambot 1;
        ~*discordbot 1;
        ~*viber 1;
        ~*skypeuripreview 1;
        ~*line 1;
        ~*googlebot 1;
        ~*bingbot 1;
        ~*yandex 1;
        ~*duckduckbot 1;
        ~*slurp 1;
        ~*baiduspider 1;
        ~*curl 1;
    }

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # Static Uploads Volume (Servidos pelo Nginx sem passar pelo Node)
        location /uploads/ {
            alias /var/www/uploads/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # match-prints é privado (design v3 §6): leitura só via /api/prints/:id/arquivo,
        # que revalida participante/revisor a cada requisição. Nada de link direto.
        location /uploads/match-prints/ {
            return 403;
        }

        # API Node + Drizzle Server
        location /api/ {
            proxy_pass http://node_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Vite SPA Static Files & react-router Fallback
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Sala por modo: /5v5/:id, /aram/:id, /1v1/:id, /time_vs_time/:id.
        # Crawlers (sem JS) recebem a página OG dinâmica da API; humanos seguem
        # para o SPA. O `set` captura modo/id no contexto do location (grupos
        # de captura não são acessíveis dentro do `if`) e o `rewrite ... break`
        # aponta para a rota /api/og, que devolve HTML com os meta tags da sala.
        location ~ ^/(5v5|aram|1v1|time_vs_time)/([0-9]+)$ {
            set $og_modo $1;
            set $og_id $2;
            if ($is_crawler) {
                rewrite ^ /api/og/$og_modo/$og_id break;
                proxy_pass http://node_api;
            }
            try_files $uri $uri/ /index.html;
        }

        # WebSocket próprio (P4): só transporta o id da sala. Repassa
        # Upgrade/Connection, Origin e Cookie — o handshake do realtime valida
        # Origin e cookie m7_session antes de aceitar.
        location /ws {
            proxy_pass http://realtime;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
    }
}
