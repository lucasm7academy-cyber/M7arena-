events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 10M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    upstream node_api {
        server app:3000;
    }

    upstream realtime {
        server realtime:3001;
    }

    # HTTP -> redireciona para HTTPS
    server {
        listen 80;
        server_name dev.m7arena.pro m7arena.pro www.m7arena.pro localhost;
        return 301 https://$host$request_uri;
    }

    # HTTPS
    server {
        listen 443 ssl;
        server_name dev.m7arena.pro m7arena.pro www.m7arena.pro localhost;

        ssl_certificate     /etc/letsencrypt/live/dev.m7arena.pro/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dev.m7arena.pro/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        root /usr/share/nginx/html;
        index index.html;

        # Static Uploads Volume (Servidos pelo Nginx sem passar pelo Node)
        location /uploads/ {
            alias /var/www/uploads/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # match-prints é privado (design v3 §6): leitura só via /api/prints/:id/arquivo,
        # que revalida participante/revisor a cada requisição. Nada de link direto.
        location /uploads/match-prints/ {
            return 403;
        }

        # API Node + Drizzle Server
        location /api/ {
            proxy_pass http://node_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Vite SPA Static Files & react-router Fallback
        location / {
            try_files $uri $uri/ /index.html;
        }

        # WebSocket próprio (P4): só transporta o id da sala. O nginx precisa
        # repassar Upgrade/Connection, Origin e Cookie — o handshake do realtime
        # valida Origin e cookie m7_session antes de aceitar.
        location /ws {
            proxy_pass http://realtime;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
    }
}
